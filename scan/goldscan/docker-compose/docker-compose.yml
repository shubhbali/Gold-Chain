version: '3.9'

services:
  redis-db:
    extends:
      file: ./services/redis.yml
      service: redis-db

  db-init:
    extends:
      file: ./services/db.yml
      service: db-init

  db:
    depends_on:
      db-init:
        condition: service_completed_successfully
    extends:
      file: ./services/db.yml
      service: db

  backend:
    depends_on:
      - db
      - redis-db
    extends:
      file: ./services/backend.yml
      service: backend
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
      args:
        RELEASE_VERSION: ${GOLDCHAIN_RELEASE_VERSION:-10.0.6}
        DISABLE_WEBAPP: "false"
    links:
      - db:database
    environment:
        ETHEREUM_JSONRPC_HTTP_URL: ${GOLDCHAIN_RPC_HTTP_URL:-http://host.docker.internal:8545/}
        ETHEREUM_JSONRPC_TRACE_URL: ${GOLDCHAIN_RPC_TRACE_URL:-http://host.docker.internal:8545/}
        ETHEREUM_JSONRPC_WS_URL: ${GOLDCHAIN_RPC_WS_URL:-ws://host.docker.internal:8645/}
        CHAIN_ID: ${GOLDCHAIN_CHAIN_ID:-7777778}

  nft_media_handler:
    depends_on:
      - backend
    extends:
      file: ./services/nft_media_handler.yml
      service: nft_media_handler
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
      args:
        RELEASE_VERSION: ${GOLDCHAIN_RELEASE_VERSION:-10.0.6}

  visualizer:
    extends:
      file: ./services/visualizer.yml
      service: visualizer

  sig-provider:
    extends:
      file: ./services/sig-provider.yml
      service: sig-provider

  frontend:
    depends_on:
      - backend
    extends:
      file: ./services/frontend.yml
      service: frontend

  stats-db-init:
    extends:
      file: ./services/stats.yml
      service: stats-db-init

  stats-db:
    depends_on:
      stats-db-init:
        condition: service_completed_successfully
    extends:
      file: ./services/stats.yml
      service: stats-db

  stats:
    depends_on:
      - stats-db
      - backend
    extends:
      file: ./services/stats.yml
      service: stats

  user-ops-indexer:
    depends_on:
      - db
      - backend
    extends:
      file: ./services/user-ops-indexer.yml
      service: user-ops-indexer

  proxy:
    depends_on:
      - backend
      - frontend
      - stats
    extends:
      file: ./services/nginx.yml
      service: proxy
